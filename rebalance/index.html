<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資産リバランスシミュレーター</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="auth_overlay" class="auth-overlay">
        <div class="card auth-card">
            <div class="section-title">セキュリティ認証</div>
            <p class="auth-desc">このツールにアクセスするには、専用のトークン(パスワード)を入力してください。</p>
            <input type="password" id="token_input" placeholder="パスワードを入力">
            <p id="auth_error" class="alert-text" style="display: none;">⚠️ パスワードが正しくありません。</p>
            <button type="button" id="btn_auth" class="btn btn-primary">認証する</button>
        </div>
    </div>

    <div class="app-container" id="app_container" style="display: none;">

        <header>
            <h1>資産リバランスシミュレーター</h1>
        </header>

        <div class="account-tabs-container">
            <div class="tab-label">編集・計算する口座を選択:</div>
            <div class="tabs-row" id="account_tabs_row"></div>
            <button type="button" id="btn_toggle_dashboard" class="btn btn-secondary">📊 全口座合算ダッシュボードを見る</button>
        </div>

        <div id="account_workspace">

            <div class="card history-bar">
                <div class="history-select-group">
                    <label for="account_history_select">📁 この口座の過去履歴:</label>
                    <select id="account_history_select">
                        <option value="latest">最新の入力状態(自動保持)</option>
                    </select>
                </div>
                <button type="button" id="btn_save_snapshot" class="btn btn-secondary">💾 現在の状態を履歴に保存</button>
            </div>

            <div class="card">
                <div class="section-title">1. リバランス方針設定</div>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="rebalance_policy" value="normal" checked> 通常(売買あり)</label>
                    <label class="radio-label"><input type="radio" name="rebalance_policy" value="no_sell"> 売却なし(追加投資のみ)</label>
                    <label class="radio-label"><input type="radio" name="rebalance_policy" value="withdrawal"> 取り崩し</label>
                </div>
            </div>

            <div id="withdrawal_amount_container" class="withdrawal-container" style="display: none;">
                <label for="withdrawal_total_amount">取り崩し希望総額:</label>
                <input type="text" id="withdrawal_total_amount" value="0" inputmode="numeric" autocomplete="off" spellcheck="false">
                <span class="unit">円</span>
            </div>

            <div class="card">
                <div class="section-title">2. 資産項目と目標バランスの入力</div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>資産項目名</th>
                                <th>目標比率</th>
                                <th>現在の資産額</th>
                                <th>売買単位</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="asset_table_body"></tbody>
                        <tfoot>
                            <tr>
                                <td><strong>合計</strong></td>
                                <td class="text-right"><span id="total_ratio">0</span> %</td>
                                <td class="text-right"><span id="total_amount">0</span> 円</td>
                                <td></td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                <button type="button" id="btn_add_asset" class="btn btn-link">+ 資産項目を追加する</button>
            </div>

            <p id="calc_error" class="alert-text" style="display: none;"></p>

            <div class="execute-row">
                <button type="button" id="btn_execute_rebalance" class="btn btn-primary btn-large">リバランス計算を実行</button>
            </div>

            <div class="card">
                <div class="section-title">3. 計算結果・おすすめの売買</div>
                <div id="result_area">
                    <div class="result-placeholder">ここに計算結果が表示されます。</div>
                </div>
            </div>

        </div>

        <div id="dashboard_workspace" style="display: none;">
            <div class="card">
                <div class="section-title">📊 全口座合算アセットアロケーション</div>
                <p class="dashboard-desc">すべての口座を統合したマクロ視点での資産比率です。</p>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr><th>資産項目名</th><th class="text-right">総資産額(合算)</th><th class="text-right">全体に占める比率</th></tr>
                        </thead>
                        <tbody id="dashboard_table_body"></tbody>
                        <tfoot>
                            <tr>
                                <td>総合計</td>
                                <td class="text-right"><span id="dashboard_grand_total">0</span> 円</td>
                                <td class="text-right">100 %</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script src="storage.js"></script>
    <script src="model.js"></script>
    <script src="solver.js"></script>
    <script src="auth.js"></script>
    <script src="ui.js"></script>
    <script>
        window.model = new AssetModel({ window: window, storage: AppStorage });
        AssetAuth.init();
    </script>
</body>
</html>
